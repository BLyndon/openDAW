<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>fft-bench browser run</title>
    <style>
        :root {
            color-scheme: light;
            --surface: #fcfcfb;
            --surface-raised: #f3f2ee;
            --border: #e1e0d9;
            --grid: #e1e0d9;
            --text-primary: #0b0b0b;
            --text-secondary: #52514e;
            --text-muted: #898781;
            --ok: #008300;
            --warn: #b26b00;
            --fail: #c62828;
            --accent: #2a78d6;
            --series-1: #2a78d6;
            --series-2: #eb6834;
            --series-3: #1baf7a;
            --series-4: #eda100;
            --series-5: #e87ba4;
            --series-6: #008300;
            --series-7: #6250d6;
            --series-8: #e34948;
        }
        @media (prefers-color-scheme: dark) {
            :root {
                color-scheme: dark;
                --surface: #1a1a19;
                --surface-raised: #232322;
                --border: #2c2c2a;
                --grid: #2c2c2a;
                --text-primary: #f0efec;
                --text-secondary: #c3c2b7;
                --text-muted: #898781;
                --ok: #0ca30c;
                --warn: #e0a030;
                --fail: #e66767;
                --accent: #3987e5;
                --series-1: #3987e5;
                --series-2: #d95926;
                --series-3: #199e70;
                --series-4: #c98500;
                --series-5: #d55181;
                --series-6: #0ca30c;
                --series-7: #9085e9;
                --series-8: #e66767;
            }
        }
        body {
            margin: 0;
            background: var(--surface);
            color: var(--text-primary);
            font: 15px/1.5 system-ui, sans-serif;
        }
        main {
            max-width: 880px;
            margin: 0 auto;
            padding: 24px 16px 64px;
        }
        h1 {
            font-size: 22px;
            margin: 0 0 4px;
        }
        .environment {
            color: var(--text-secondary);
            font-size: 13px;
            margin-bottom: 24px;
        }
        section {
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 16px 20px;
            margin-bottom: 16px;
        }
        section.locked {
            opacity: 0.5;
        }
        .step-head {
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .step-head h2 {
            font-size: 17px;
            margin: 0;
            flex: 1;
        }
        .purpose, .expected {
            margin: 6px 0 0;
            color: var(--text-secondary);
        }
        .expected strong {
            color: var(--text-primary);
            font-weight: 600;
        }
        button {
            font: inherit;
            padding: 6px 16px;
            border-radius: 6px;
            border: 1px solid var(--accent);
            background: var(--accent);
            color: #fff;
            cursor: pointer;
        }
        button:disabled {
            background: transparent;
            color: var(--text-muted);
            border-color: var(--border);
            cursor: default;
        }
        button.small {
            padding: 0 8px;
            font-size: 12px;
            margin-left: 6px;
        }
        .outcome {
            margin-top: 10px;
            font-weight: 600;
        }
        .outcome.ok { color: var(--ok); }
        .outcome.warn { color: var(--warn); }
        .outcome.fail { color: var(--fail); }
        .outcome.running { color: var(--accent); }
        .outcome ul {
            margin: 4px 0 0;
            font-weight: 400;
            color: var(--text-secondary);
        }
        .results {
            margin-top: 12px;
            overflow-x: auto;
        }
        .results h4 {
            margin: 16px 0 6px;
            font-size: 14px;
        }
        .results p {
            color: var(--text-secondary);
            font-size: 13px;
        }
        table {
            border-collapse: collapse;
            font-size: 13px;
            font-variant-numeric: tabular-nums;
        }
        th, td {
            border-bottom: 1px solid var(--border);
            padding: 4px 12px 4px 0;
            text-align: right;
            white-space: nowrap;
        }
        th:first-child, td:first-child {
            text-align: left;
        }
        svg {
            width: 100%;
            height: auto;
            margin-top: 12px;
        }
        details pre {
            background: var(--surface-raised);
            padding: 12px;
            overflow-x: auto;
            font-size: 12px;
        }
        .hidden {
            display: none;
        }
    </style>
</head>
<body>
<main>
    <h1>fft-bench · browser run</h1>
    <div class="environment" id="environment">Environment not checked yet.</div>
    <div id="steps"></div>
</main>
<script type="module" src="/web/page.mjs"></script>
</body>
</html>
