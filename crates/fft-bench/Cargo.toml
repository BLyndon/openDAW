[package]
name = "fft-bench"
version = "0.0.0"
edition = "2021"
publish = false

[lib]
crate-type = ["lib"]

[dependencies]
dsp = {path = "../dsp"}
math = {path = "../math"}
libm = "0.2"

# The f64 reference DFT is O(n²): ~134 M multiply-adds per signal at n = 16384, too slow unoptimised.
[profile.test]
opt-level = 3
